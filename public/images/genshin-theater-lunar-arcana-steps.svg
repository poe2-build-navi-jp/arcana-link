<text x="70" y="158" fill="#f6f3e9" font-size="42" font-weight="700">幻想シアター・月諭アルカナ入手手順</text>
<text x="70" y="200" fill="#b8cad6" font-size="21">月諭モードの挑戦と第十幕クリアを確認</text>
<rect x="70" y="245" width="505" height="145" rx="16" fill="#11334e" stroke="#668495"/><circle cx="110" cy="288" r="23" fill="#32666c" stroke="#ddb978"/><text x="96" y="296" font-size="20" font-weight="700" fill="#fff">01</text><text x="151" y="301" font-size="27" font-weight="700" fill="#fff">月諭モードに参加</text><text x="152" y="349" font-size="20" font-weight="500" fill="#bed1da">参加条件をゲーム内で確認</text><rect x="605" y="245" width="505" height="145" rx="16" fill="#11334e" stroke="#668495"/><circle cx="645" cy="288" r="23" fill="#32666c" stroke="#ddb978"/><text x="631" y="296" font-size="20" font-weight="700" fill="#fff">02</text><text x="686" y="301" font-size="27" font-weight="700" fill="#fff">アルカナ挑戦を完了</text><text x="687" y="349" font-size="20" font-weight="500" fill="#bed1da">途中の挑戦をすべて確認</text><rect x="70" y="420" width="505" height="145" rx="16" fill="#11334e" stroke="#668495"/><circle cx="110" cy="463" r="23" fill="#32666c" stroke="#ddb978"/><text x="96" y="471" font-size="20" font-weight="700" fill="#fff">03</text><text x="151" y="476" font-size="27" font-weight="700" fill="#fff">第十幕をクリア</text><text x="152" y="524" font-size="20" font-weight="500" fill="#bed1da">挑戦の完了も確認する</text><rect x="605" y="420" width="505" height="145" rx="16" fill="#11334e" stroke="#668495"/><circle cx="645" cy="463" r="23" fill="#32666c" stroke="#ddb978"/><text x="631" y="471" font-size="20" font-weight="700" fill="#fff">04</text><text x="686" y="476" font-size="27" font-weight="700" fill="#fff">アルカナを引く</text><text x="687" y="524" font-size="20" font-weight="500" fill="#bed1da">報酬の表示を確認</text><text x="70" y="620" font-size="19" font-weight="500" fill="#e1c58e">※ 開催期ごとの詳細はゲーム内の案内を確認してください。</text><path d="M70 677H1130" stroke="#b6935e" stroke-opacity=".65"/><text x="70" y="708" fill="#c9d9e0" font-size="18">arcana-card-link.pages.dev  ·  非公式のオリジナル図解</text></g></svg>